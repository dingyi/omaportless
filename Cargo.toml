[package]
name = "omaportless"
version = "0.2.2"
edition = "2021"
license = "MIT"
description = "Named .localhost URLs for local dev servers"
publish = false

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }

[[bin]]
name = "omaportless"
path = "src/main.rs"
